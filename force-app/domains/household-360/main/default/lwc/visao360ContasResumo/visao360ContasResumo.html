<template>
    <!-- Financial Accounts — faixa de totais. Somente leitura, sem eventos. -->
    <template lwc:if={temResumo}>
        <lightning-card title="Resumo">
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <div class="slds-grid slds-wrap slds-gutters">
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
                        <div class="c-cresumo_rotulo">Total em contas</div>
                        <div class="c-cresumo_valor">{aum}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
                        <div class="c-cresumo_rotulo">Household</div>
                        <div class="c-cresumo_valor">{patrimonio}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
                        <div class="c-cresumo_rotulo">Ativos fora da casa</div>
                        <div class="c-cresumo_valor">{ativosFora}</div>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
                        <div class="c-cresumo_rotulo">Produtos</div>
                        <div class="c-cresumo_valor">{total}</div>
                    </div>
                </div>
            </div>
        </lightning-card>
    </template>
</template>
