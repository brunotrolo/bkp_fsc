<template>
    <!-- Aba Resumo — faixa de KPIs (patrimônio, AUM, wallet share, score).
         Somente leitura. Sem eventos. -->
    <template lwc:if={temResumo}>
        <div class="slds-grid slds-wrap slds-gutters">
            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
                <div class="c-resumo-kpi">
                    <div class="c-resumo-kpi_rotulo">Patrimônio (household)</div>
                    <div class="c-resumo-kpi_valor">{patrimonio}</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
                <div class="c-resumo-kpi">
                    <div class="c-resumo-kpi_rotulo">AUM</div>
                    <div class="c-resumo-kpi_valor">{aum}</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
                <div class="c-resumo-kpi">
                    <div class="c-resumo-kpi_rotulo">Wallet share</div>
                    <div class="c-resumo-kpi_valor">{walletShare}</div>
                </div>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-large-size_1-of-4">
                <div class="c-resumo-kpi">
                    <div class="c-resumo-kpi_rotulo">Score / Cadastro <span class="c-resumo-kpi_pct">{completude} completo</span></div>
                    <div class="c-resumo-kpi_valor">{scoreCredito}</div>
                </div>
            </div>
        </div>
    </template>
    <template lwc:else>
        <p class="slds-text-body_small slds-p-around_medium">Sem dados de resumo para esta raiz no momento.</p>
    </template>
</template>
