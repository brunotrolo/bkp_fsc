<template>
    <lightning-modal-header label="Selecionar via de cartão"></lightning-modal-header>
    <lightning-modal-body>
        <p class="slds-m-bottom_small slds-text-body_small c-drawer-desc">Escolha a via que motivou o contato — ativas, canceladas e bloqueadas estão listadas.</p>
        <div class="slds-grid slds-wrap slds-gutters">
            <template for:each={vias} for:item="via">
                <div key={via.chave} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                    <button type="button" class="c-via-card" style={via.estiloCartao} data-id={via.externalContractId} onclick={aoEscolherVia} aria-label={via.ariaLabel}>
                        <div class="c-via-card_top">
                            <span class="c-via-card_bandeira">{via.brand} {via.category}</span>
                            <lightning-badge label={via.status}></lightning-badge>
                        </div>
                        <div class="c-via-card_final">{via.last4Masked}</div>
                        <div class="c-via-card_portador">{via.holderName} • {via.category}</div>
                        <div class="c-via-card_rodape">
                            <span>{via.limite} • {via.anuidade}</span>
                        </div>
                    </button>
                </div>
            </template>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Cancelar" variant="neutral" onclick={aoCancelar}></lightning-button>
    </lightning-modal-footer>
</template>
