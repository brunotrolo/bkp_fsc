<template>
    <lightning-modal-header label="Selecionar cota de consórcio"></lightning-modal-header>
    <lightning-modal-body>
        <p class="slds-m-bottom_small slds-text-body_small c-drawer-desc">Cliente possui múltiplas cotas — Imóvel, Veículo e Rural (com mais de uma cota no mesmo grupo). Escolha a cota que motivou o contato.</p>
        <div class="slds-grid slds-wrap slds-gutters">
            <template for:each={cotas} for:item="cota">
                <div key={cota.chave} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                    <button type="button" class="c-consorcio-card" data-id={cota.externalContractId} onclick={aoEscolherCota} aria-label={cota.ariaLabel}>
                        <div class="c-consorcio-card_top">
                            <span class="c-consorcio-card_tipo">
                                <lightning-icon icon-name="utility:contract_doc" size="x-small" alternative-text={cota.tipo}></lightning-icon>
                                {cota.tipo} • Grupo {cota.grupo} / Cota {cota.cota}
                            </span>
                            <lightning-badge label={cota.status}></lightning-badge>
                        </div>
                        <div class="c-consorcio-card_valor">{cota.valor}</div>
                        <div class="c-consorcio-card_detalhe">{cota.contemplacao} • {cota.parcela}</div>
                        <div class="c-consorcio-card_status">Status: {cota.status}</div>
                    </button>
                </div>
            </template>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Cancelar" variant="neutral" onclick={aoCancelar}></lightning-button>
    </lightning-modal-footer>
</template>
