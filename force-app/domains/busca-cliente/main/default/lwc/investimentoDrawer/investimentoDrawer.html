<template>
    <lightning-modal-header label="Selecionar investimento"></lightning-modal-header>
    <lightning-modal-body>
        <p class="slds-m-bottom_small slds-text-body_small c-drawer-desc">Carteira diversificada — renda fixa, renda variável, CDB e fundos. Escolha a posição que motivou o contato.</p>
        <div class="slds-grid slds-wrap slds-gutters">
            <template for:each={investimentos} for:item="inv">
                <div key={inv.chave} class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-p-bottom_small">
                    <button type="button" class="c-invest-card" data-id={inv.externalContractId} onclick={aoEscolherInvestimento} aria-label={inv.ariaLabel}>
                        <div class="c-invest-card_top">
                            <span class="c-invest-card_classe">
                                <lightning-icon icon-name="utility:chart" size="x-small" alternative-text={inv.classe}></lightning-icon>
                                {inv.classe}
                            </span>
                            <lightning-badge label={inv.classe}></lightning-badge>
                        </div>
                        <div class="c-invest-card_produto">{inv.produto}</div>
                        <div class="c-invest-card_valor">{inv.valor}</div>
                        <div class="c-invest-card_detalhe">{inv.rentabilidade} • {inv.vencimento}</div>
                        <div class="c-invest-card_risco">Risco: {inv.risco}</div>
                    </button>
                </div>
            </template>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button label="Cancelar" variant="neutral" onclick={aoCancelar}></lightning-button>
    </lightning-modal-footer>
</template>
